name: Compilar APK (Android)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ID: ${{ vars.APP_ID || 'com.radar.noticias' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Preparar la app web
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          SITE="${SITE_URL:-https://${OWNER}.github.io/${REPO}/}"
          case "$SITE" in */) ;; *) SITE="$SITE/" ;; esac
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p apk/www
          cp index.html styles.css app.js sw.js manifest.webmanifest apk/www/
          cp -r icons apk/www/
          printf "window.RADAR_CONFIG = { dataUrl: '%sdata/noticias.json', version: '%s' };\n" "$SITE" "$VERSION" > apk/www/config.js
          cat apk/www/config.js
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Crear proyecto Capacitor
        working-directory: apk
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/status-bar@latest @capacitor/share@latest
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "Radar",
            "webDir": "www",
            "backgroundColor": "#0a0b0e",
            "android": { "backgroundColor": "#0a0b0e", "adjustMarginsForEdgeToEdge": "force" }
          }
          EOF
          npx cap add android

      - name: Generar íconos y splash
        working-directory: apk
        continue-on-error: true
        run: |
          npx --yes @capacitor/assets@latest generate --android \
            --iconBackgroundColor '#0a0b0e' --iconBackgroundColorDark '#0a0b0e' \
            --splashBackgroundColor '#0a0b0e' --splashBackgroundColorDark '#0a0b0e'

      - name: Sincronizar y fijar versión
        working-directory: apk
        run: |
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle

      - name: Reutilizar firma debug
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: radar-debug-keystore-v1

      - name: Compilar APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radar.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alineado.apk"
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/radar.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "${KEY_ALIAS:-radar}" --key-pass env:KEY_PASSWORD \
              --out "$GITHUB_WORKSPACE/Radar-${VERSION}.apk" "$RUNNER_TEMP/alineado.apk"
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Radar-${VERSION}.apk" | head -3
            rm -f "$RUNNER_TEMP/radar.jks"
          else
            echo "::warning::No hay keystore propio. Se generó un APK debug. Revisa el README para crear tu firma."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Radar-${VERSION}-debug.apk"
          fi
          ls -la "$GITHUB_WORKSPACE"/Radar-*.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Radar-${{ env.VERSION }}
          path: Radar-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.VERSION }}
          name: Radar ${{ env.VERSION }}
          body: |
            APK de Radar generado automáticamente.
            Descárgalo en tu Android, ábrelo y permite "instalar apps de origen desconocido" si te lo pide.
          files: Radar-*.apk
          make_latest: true
