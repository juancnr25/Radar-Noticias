<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar · Ciencia, tecnología e historia</title>
  <meta name="description" content="Noticias diarias de tecnología, hallazgos, ciencia e historia, traducidas al español.">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="fija">
  <header class="top">
    <div class="marca">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
        <path class="barrido" d="M20 20 L20 3 A17 17 0 0 0 7 9 Z" fill="var(--cian)" opacity=".35"/>
        <line x1="20" y1="20" x2="20" y2="3" stroke="var(--cian)" stroke-width="2"/>
        <circle cx="12" cy="14" r="2.2" fill="currentColor"/>
      </svg>
      <div>
        <h1>RADAR</h1>
        <p id="estado" class="mono estado">Cargando…</p>
      </div>
    </div>
    <div class="acciones">
      <button id="btnRefrescar" class="icono" aria-label="Actualizar noticias">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnAjustes" class="icono" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button data-vista="hoy" class="activa">Hoy</button>
    <button data-vista="ultimo">Lo último</button>
    <button data-vista="tecnologia">Tecnología</button>
    <button data-vista="hallazgos">Hallazgos</button>
    <button data-vista="ciencia">Ciencia</button>
    <button data-vista="historia">Historia</button>
    <button data-vista="guardados">Guardados <span id="numGuardados" class="mono contador"></span></button>
  </nav>
  </div>

  <div id="banner" class="banner" hidden></div>
  <main id="vista" class="vista" aria-live="polite"></main>

  <div id="hoja" class="hoja" hidden>
    <div class="hoja-fondo" data-cerrar></div>
    <section class="hoja-panel" role="dialog" aria-modal="true">
      <div class="asa" data-cerrar></div>
      <div id="hojaContenido"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
